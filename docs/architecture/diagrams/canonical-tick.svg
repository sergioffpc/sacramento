" textLength="281.792">reserve mandatory reconstruction capacity</text><path d="M153.889,265.555 L218.332,265.555 L218.332,272.688 L208.332,282.688 L153.889,282.688 L153.889,265.555" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="153.889" y="265.555" width="1136.437" height="426.203" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="168.889" y="278.622" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="233.332" y="277.765" fill="#000" font-size="11" textLength="220.8" font-weight="700">[candidate rejected before commit]</text><line x1="289.073" y1="313.82" x2="331.073" y2="313.82" style="stroke:#181818;stroke-width:1;"/><line x1="331.073" y1="313.82" x2="331.073" y2="326.82" style="stroke:#181818;stroke-width:1;"/><line x1="290.073" y1="326.82" x2="331.073" y2="326.82" style="stroke:#181818;stroke-width:1;"/><polygon points="300.073,322.82,290.073,326.82,300.073,330.82,296.073,326.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="296.073" y="308.754" fill="#000" font-size="13" font-weight="700">6</text><text x="309.118" y="308.754" fill="#000" font-size="13" textLength="301.533">discard candidate; no Tick/time/state advance</text><path d="M197.149,339.82 L197.149,379.82 L1027.149,379.82 L1027.149,349.82 L1017.149,339.82 L197.149,339.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1017.149,339.82 L1017.149,349.82 L1027.149,349.82 L1017.149,339.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="451.742" y="356.887" fill="#000" font-size="13" textLength="273.102">Mandatory reconstruction-capacity failure</text><text x="451.742" y="372.02" fill="#000" font-size="13" textLength="311.924">terminates the session; it is not silent data loss.</text><line x1="153.889" y1="386.086" x2="1290.325" y2="386.086" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="158.889" y="398.296" fill="#000" font-size="11" textLength="146.953" font-weight="700">[candidate can commit]</text><path d="M273.073,407.891 L547.458,407.891 L547.458,415.023 L537.458,425.023 L273.073,425.023 L273.073,407.891" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="273.073" y="407.891" width="341.841" height="84.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="288.073" y="420.958" fill="#000" font-size="13" textLength="229.385" font-weight="700">one authoritative commit point</text><line x1="289.073" y1="471.289" x2="331.073" y2="471.289" style="stroke:#181818;stroke-width:1;"/><line x1="331.073" y1="471.289" x2="331.073" y2="484.289" style="stroke:#181818;stroke-width:1;"/><line x1="290.073" y1="484.289" x2="331.073" y2="484.289" style="stroke:#181818;stroke-width:1;"/><polygon points="300.073,480.289,290.073,484.289,300.073,488.289,296.073,484.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="296.073" y="458.657" fill="#000" font-size="13" font-weight="700">7</text><text x="309.118" y="451.09" fill="#000" font-size="13" textLength="252.783">commit state + Tick + Simulated Time</text><text x="309.118" y="466.223" fill="#000" font-size="13" textLength="289.796">+ events + reconstruction record atomically</text><path d="M172.889,510.289 L237.332,510.289 L237.332,517.422 L227.332,527.422 L172.889,527.422 L172.889,510.289" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="172.889" y="510.289" width="1092.437" height="167.469" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="187.889" y="523.356" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="252.332" y="522.5" fill="#000" font-size="11" textLength="140.126" font-weight="700">[publication succeeds]</text><polygon points="1132.161,554.555,1142.161,558.555,1132.161,562.555,1136.161,558.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.073" y1="558.555" x2="1138.161" y2="558.555" style="stroke:#181818;stroke-width:1;"/><text x="296.073" y="553.489" fill="#000" font-size="13" font-weight="700">8</text><text x="309.118" y="553.489" fill="#000" font-size="13" textLength="247.578">publish immutable committed version</text><line x1="172.889" y1="567.555" x2="1265.325" y2="567.555" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="177.889" y="579.765" fill="#000" font-size="11" textLength="134.562" font-weight="700">[failure after commit]</text><line x1="289.073" y1="606.492" x2="331.073" y2="606.492" style="stroke:#181818;stroke-width:1;"/><line x1="331.073" y1="606.492" x2="331.073" y2="619.492" style="stroke:#181818;stroke-width:1;"/><line x1="290.073" y1="619.492" x2="331.073" y2="619.492" style="stroke:#181818;stroke-width:1;"/><polygon points="300.073,615.492,290.073,619.492,300.073,623.492,296.073,619.492" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="296.073" y="601.426" fill="#000" font-size="13" font-weight="700">9</text><text x="309.118" y="601.426" fill="#000" font-size="13" textLength="337.054">complete publication OR terminate technical failure</text><path d="M191.399,632.492 L191.399,672.492 L1241.399,672.492 L1241.399,642.492 L1231.399,632.492 L191.399,632.492" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1231.399,632.492 L1231.399,642.492 L1241.399,642.492 L1231.399,632.492" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="584.104" y="649.559" fill="#000" font-size="13" textLength="228.884">Never roll back the committed Tick</text><text x="584.104" y="664.692" fill="#000" font-size="13" textLength="256.026">or expose a partially authoritative Tick.</text><path d="M4.64,710.758 L4.64,750.758 L1233.64,750.758 L1233.64,720.758 L1223.64,710.758 L4.64,710.758" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1223.64,710.758 L1223.64,720.758 L1233.64,720.758 L1223.64,710.758" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="364.816" y="727.825" fill="#000" font-size="13" textLength="423.293">The Tick never waits for clients, Observability or external export.</text><text x="364.816" y="742.958" fill="#000" font-size="13" textLength="499.973">Prediction and Presentation run independently and cannot author outcomes.</text></g></svg>