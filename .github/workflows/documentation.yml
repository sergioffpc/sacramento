name: Documentation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check canonical sources, links, traces and diagram provenance
        run: python3 scripts/documentation.py check
      - name: Exercise validator rejection cases
        run: python3 -m unittest discover -s tests/documentation -v
      - name: Generate disposable navigation
        run: python3 scripts/documentation.py generate
