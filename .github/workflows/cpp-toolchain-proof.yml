name: C++ toolchain proof

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Canonical gate phase
        required: true
        default: pr
        type: choice
        options:
          - pr
          - nightly
          - weekly
          - release
  push:
    branches:
      - prototype/cpp-toolchain-proof
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate proof configuration
        working-directory: prototypes/cpp_toolchain_proof
        run: ./scripts/proof.sh static

  debian:
    needs: static
    runs-on: [self-hosted, sacramento, debian-13-6, cpp-proof]
    steps:
      - name: Check out the proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run the native Debian proof
        working-directory: prototypes/cpp_toolchain_proof
        env:
          PROOF_PHASE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.phase || 'pr' }}
        run: ./scripts/proof.sh "$PROOF_PHASE"
      - name: Retain Debian evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-proof-debian
          path: prototypes/cpp_toolchain_proof/evidence
          if-no-files-found: error

  windows:
    needs: static
    runs-on: [self-hosted, sacramento, windows-11-25h2, cpp-proof]
    steps:
      - name: Check out the proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run the native Windows proof
        working-directory: prototypes/cpp_toolchain_proof
        shell: pwsh
        env:
          PROOF_PHASE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.phase || 'pr' }}
        run: .\scripts\proof.ps1 $env:PROOF_PHASE
      - name: Retain Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-proof-windows
          path: prototypes/cpp_toolchain_proof/evidence
          if-no-files-found: error

  codeql:
    needs: static
    runs-on: [self-hosted, sacramento, debian-13-6, cpp-proof]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize pinned CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: c-cpp
          tools: /opt/sacramento/codeql/2.26.4
      - name: Build explicitly with the canonical script
        working-directory: prototypes/cpp_toolchain_proof
        run: ./scripts/proof.sh pr
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
